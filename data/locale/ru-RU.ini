WidgetBrowser.Url="URL виджета"
WidgetBrowser.Url.Description="Полный адрес виджета или веб-страницы, например https://example.com/overlay. Прозрачный фон страницы сохраняется в сцене."
WidgetBrowser.Width="Ширина"
WidgetBrowser.Width.Description="Ширина области отображения в пикселях. Масштабируйте источник в сцене, чтобы изменить его видимый размер."
WidgetBrowser.Height="Высота"
WidgetBrowser.Height.Description="Высота области отображения в пикселях. Масштабируйте источник в сцене, чтобы изменить его видимый размер."
WidgetBrowser.Fps="Кадров в секунду"
WidgetBrowser.Fps.Description="Как часто виджет перерисовывается. Меньшие значения снижают нагрузку на процессор."
WidgetBrowser.Interactive="Разрешить ввод мышью и клавиатурой"
WidgetBrowser.Interactive.Description="Передаёт мышь и клавиатуру из окна OBS «Взаимодействие» в виджет. Отключите, чтобы виджет был только для показа."
WidgetBrowser.Interactive.Hint="Откройте контекстное меню источника -> «Взаимодействие», чтобы нажимать кнопки и вводить текст в виджете."
WidgetBrowser.Endpoints.Hint="Эндпоинты собираются автоматически во время работы виджета. Нажмите «Обновить», чтобы перестроить список."
WidgetBrowser.Endpoints.Empty="Эндпоинты пока не найдены. Загрузите виджет и поработайте с ним, чтобы он выполнил запросы."
WidgetBrowser.Endpoints.Refresh="Обновить список эндпоинтов"
WidgetBrowser.Endpoints.AddToActions="Добавить найденные в действия"
WidgetBrowser.Actions="Действия"
WidgetBrowser.Actions.Hint="Одно действие на строку: Название | МЕТОД | URL | page/plugin. Пример: Старт таймера | POST | /api/timer/start | page. Относительные URL считаются от адреса виджета. page — запрос выполняется внутри виджета (сохраняются cookies и сессия), plugin — запрос отправляет сам OBS. Горячие клавиши назначаются в «Настройки -> Горячие клавиши» в разделе этого источника."
WidgetBrowser.Reload="Перезагрузить страницу"
WidgetBrowser.Reload.Description="Перезагружает текущую страницу. При смене URL виджет перезагружается автоматически."
WidgetBrowser.ReloadHint="Нажмите «Перезагрузить страницу», если виджет завис или показывает устаревшее содержимое."
