WidgetBrowser.SourceName="Widget Browser"
WidgetBrowser.Group.Source="Source"
WidgetBrowser.Group.Size="Size and performance"
WidgetBrowser.Group.Interaction="Interaction"
WidgetBrowser.Group.Endpoints="Widget endpoints"
WidgetBrowser.Group.ActionList="Actions"
WidgetBrowser.Url="Widget URL"
WidgetBrowser.Url.Description="Full address of the widget or web page, for example https://example.com/overlay. Transparent page backgrounds stay transparent in the scene."
WidgetBrowser.Width="Width"
WidgetBrowser.Width.Description="Viewport width in pixels. Resize the source in the scene to scale the widget."
WidgetBrowser.Height="Height"
WidgetBrowser.Height.Description="Viewport height in pixels. Resize the source in the scene to scale the widget."
WidgetBrowser.Fps="Frames per second"
WidgetBrowser.Fps.Description="How many times per second the widget is redrawn. Lower values reduce CPU load."
WidgetBrowser.Interactive="Allow mouse and keyboard input"
WidgetBrowser.Interactive.Description="Forwards mouse and keyboard from the OBS Interact window to the widget. Disable to make the widget display-only."
WidgetBrowser.Interactive.Hint="Use the source context menu -> Interact to click and type inside the widget."
WidgetBrowser.Endpoints.Hint="Endpoints are collected automatically while the widget runs. Use Refresh to rebuild this list."
WidgetBrowser.Endpoints.Empty="No endpoints discovered yet. Load the widget and use it so it performs requests."
WidgetBrowser.Endpoints.Refresh="Refresh endpoint list"
WidgetBrowser.Endpoints.AddToActions="Add discovered endpoints to actions"
WidgetBrowser.Actions="Actions"
WidgetBrowser.Actions.Hint="One action per line: Name | METHOD | URL | page/plugin. Example: Start timer | POST | /api/timer/start | page. Relative URLs are resolved against the widget URL. page sends the request from inside the widget (cookies and session are kept), plugin sends it from OBS. Assign hotkeys in Settings -> Hotkeys, section of this source."
WidgetBrowser.Reload="Reload page"
WidgetBrowser.Reload.Description="Reloads the current page. Changing the URL reloads the widget automatically."
WidgetBrowser.ReloadHint="Use reload if the widget is frozen or its content is out of date."
